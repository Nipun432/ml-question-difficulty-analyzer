<!DOCTYPE html>
<html>
<head>
    <title>Question Difficulty Analyzer</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b, #020617);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #0f172a;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            resize: none;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
            box-shadow: 0 0 10px #38bdf8;
        }

        .result {
            margin-top: 20px;
            background: #020617;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
        }

    </style>

</head>

<body>

<div class="container">

    <h1>📊 Question Analyzer</h1>

    <form method="POST">
        <textarea name="question" rows="4" placeholder="Enter your question..."></textarea>
        <br>
        <button type="submit">Analyze</button>
    </form>

    {% if result %}
    <div class="result">
        <p><b>Question:</b> {{ question }}</p>

        <!-- ✅ Colored Difficulty -->
        <p><b>Difficulty:</b> 
            <span style="color: {{ color }}; font-weight: bold;">
                {{ difficulty }}
            </span>
        </p>

        <p><b>Confidence:</b> {{ confidence }}%</p>
        <p><b>Marks Distribution:</b> {{ dist }}</p>

        <!-- ✅ Reason -->
        <p><b>🧠 Reason:</b> {{ reason }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
